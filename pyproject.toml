[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-bg-aes"
version = "1.0.0"
description = "PM-BG-AES hybrid codec research artifact (archival supplementary package)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pycryptodome>=3.18", "psutil>=5.9"]
authors = [
    { name = "Samsul Arifin" },
    { name = "Ade Kurniawan" },
    { name = "Muhamad Totoh Muharam" },
    { name = "Ansori" },
    { name = "Tiawan" },
    { name = "Merios Gusan Putra" },
    { name = "Edwin Kristianto Sijabat" },
    { name = "Dani Lukman Hakim" },
    { name = "Dwi Wijonarko" },
]

[project.urls]
Repository = "https://github.com/dwi-wijonarko-unej/pm-bg-aes-supplementary"

[project.optional-dependencies]
analysis = ["matplotlib>=3.6", "scipy>=1.10"]
test = ["pytest>=7"]
docs = ["pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
